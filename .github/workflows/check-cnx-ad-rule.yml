name: Check CNX Software ad rule

# Fires at six irregular-minute slots between 04:00 and 05:00 UTC (avoiding
# round numbers like :00/:10/:20, which is when GitHub Actions scheduled-
# event load peaks and runs are most likely to be delayed or dropped).
# On each firing, a lottery decides whether *this* slot is the one that
# actually runs the check, so only one real check happens per day (no long
# in-job sleep, no wasted runner minutes). A committed marker file prevents
# a duplicate run if more than one slot happens to win on the same day, and
# the last slot always fires as a safety net if none of the earlier ones did.

on:
  schedule:
    - cron: "7 4 * * *"
    - cron: "17 4 * * *"
    - cron: "24 4 * * *"
    - cron: "33 4 * * *"
    - cron: "41 4 * * *"
    - cron: "52 4 * * *"
  workflow_dispatch: {}

jobs:
  check-rule:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Lottery - decide whether this slot runs
        id: lottery
        run: |
          TODAY=$(date -u +%F)
          LAST_RUN="none"
          if [ -f .last-run-date.txt ]; then
            LAST_RUN=$(cat .last-run-date.txt)
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual dispatch: always run."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$LAST_RUN" = "$TODAY" ]; then
            echo "Already ran today ($TODAY) in an earlier slot. Skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MINUTES=(7 17 24 33 41 52)
          NOW_MIN=$((10#$(date -u +%M)))
          INDEX=0
          BEST_DIFF=999
          for i in "${!MINUTES[@]}"; do
            DIFF=$(( NOW_MIN - MINUTES[i] ))
            if [ "$DIFF" -ge 0 ] && [ "$DIFF" -lt "$BEST_DIFF" ]; then
              BEST_DIFF=$DIFF
              INDEX=$i
            fi
          done
          TOTAL=${#MINUTES[@]}
          REMAINING=$((TOTAL - INDEX))

          ROLL=$(( RANDOM % REMAINING ))
          echo "Slot index=$INDEX remaining=$REMAINING roll=$ROLL"
          if [ "$ROLL" -eq 0 ]; then
            echo "This slot wins the lottery. Running the check."
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "This slot lost the lottery. Skipping, a later slot may run."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run rule checker
        if: steps.lottery.outputs.run == 'true'
        run: python3 check_cnx_ad_rule.py

      - name: Commit marker and any updated rule
        if: steps.lottery.outputs.run == 'true'
        run: |
          date -u +%F > .last-run-date.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-run-date.txt cnx-software.txt
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily cnx-software.com ad rule check"
            git push
          else
            echo "Nothing to commit."
          fi
